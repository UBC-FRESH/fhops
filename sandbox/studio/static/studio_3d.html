<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FHOPS Studio 3D</title>
  <link rel="stylesheet" href="static/studio_3d.css" />
  <script type="importmap">{"imports":{"three":"./lab/vendor/three/three.module.js"}}</script>
</head>
<body>
  <header>
    <a class="back" href="?project=" id="back-plan">← plan</a>
    <strong>FHOPS Studio 3D</strong>
    <span id="project-name">loading…</span>
    <span id="status" class="muted">ready</span>
    <button id="save">Save 3D edits</button>
  </header>
  <main>
    <div id="scene"></div>
    <aside id="tools">
      <h2>Tools</h2>
      <button data-tool="orbit" class="active">Orbit</button>
      <button data-tool="landing">Move landing</button>
      <button data-tool="retain">Retain trees</button>
      <button data-tool="terrain">Terraform</button>
      <button data-tool="boundary">Boundary vertices</button>
      <label>Brush radius <output id="brush-label">25 m</output></label>
      <input id="brush" type="range" min="5" max="120" step="5" value="25" />
      <label class="check"><input id="lower" type="checkbox" /> Lower terrain (Shift)</label>
      <button id="fit" class="secondary">Fit view</button>
      <div class="hint">Click trees to toggle retention. Drag boundary handles. Click terrain to raise; Shift-click lowers.</div>
    </aside>
    <aside id="stats">
      <h2>Scene</h2>
      <div id="scene-stats" class="muted">loading…</div>
      <p class="hint">3D editing writes the same project used by the plan editor and simulation.</p>
    </aside>
  </main>
  <script type="module" src="static/studio_3d.js"></script>
</body>
</html>
