<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Studio scenario comparison</title>
  <link rel="stylesheet" href="static/studio_compare.css" />
</head>
<body>
  <header>
    <a href="./" class="back">← Studio</a>
    <strong>Scenario comparison</strong>
    <span id="status" class="muted">loading…</span>
  </header>
  <main>
    <section class="picker">
      <div class="side">
        <h2>Left</h2>
        <label>Project <select id="left-project"></select></label>
        <label>Run <select id="left-run"></select></label>
      </div>
      <div class="side">
        <h2>Right</h2>
        <label>Project <select id="right-project"></select></label>
        <label>Run <select id="right-run"></select></label>
      </div>
      <button id="compare">Compare</button>
    </section>
    <section id="summary" class="panel"></section>
    <section id="machines" class="panel"></section>
    <section id="trucks" class="panel"></section>
    <section id="landings" class="panel"></section>
  </main>
  <script type="module" src="static/studio_compare.js"></script>
</body>
</html>
