# Synthetic multi-day marine regression fixture for FHOPS #196.
#
# One barge, 10,000 m3, Quatsino Sound -> Ladysmith Harbour. The 1,910-minute
# loaded leg and 1,910-minute return make a 3,955-minute barge cycle, which
# exceeds the Phase I daily regular-minutes budget. The fixture is deliberately
# small so the current infeasibility is attributable to the barge fleet, not
# truck capacity or demand.
name: "Multi-day marine regression: Quatsino to Ladysmith"
num_days: 8
schema_version: 1.1.0
start_date: 2026-11-02
data:
  blocks: blocks.csv
  machines: machines.csv
  landings: landings.csv
  calendar: calendar.csv
  prod_rates: production_rates.csv
hauling:
  planning_horizon_days: 8
  start_day: 1
  log_sorts:
    - id: coastal_mixed
      sorted: true
      description: Synthetic coastal mixed sawlogs
  contractors:
    - id: c1
      name: Synthetic coast contractor
      preferred_daily_truckloads: 8
  truck_types:
    - id: highway
      capacity_m3: 45
      fixed_cost: 120.0
      variable_cost_per_minute: 1.20
      overtime_cost_per_minute: 1.80
      can_carry_sorted: true
      can_carry_unsorted: true
