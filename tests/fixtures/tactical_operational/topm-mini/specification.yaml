harvest_modes:
  continuous:
    allows_fractional_area: true
    enforces_minimum_area: false
  semi_continuous:
    allows_fractional_area: true
    enforces_minimum_area: true
  whole_block:
    allows_fractional_area: false
    enforces_minimum_area: true

hand_calculated_cases:
  - case_id: continuous_partial_cut_allowed
    mode: continuous
    option_id: B1__ground_fb_skid__Y1-P1
    requested_area_ha: 2.5
    expected:
      activation: 1
      harvested_area_ha: 2.5
      sawlog_volume_m3: 200.0
      pulp_volume_m3: 50.0

  - case_id: semi_continuous_rejects_below_minimum
    mode: semi_continuous
    option_id: B1__ground_fb_skid__Y1-P1
    requested_area_ha: 1.5
    expected:
      activation: 0
      harvested_area_ha: 0.0
      sawlog_volume_m3: 0.0
      pulp_volume_m3: 0.0

  - case_id: semi_continuous_accepts_at_minimum
    mode: semi_continuous
    option_id: B1__ground_fb_skid__Y1-P1
    requested_area_ha: 2.0
    expected:
      activation: 1
      harvested_area_ha: 2.0
      sawlog_volume_m3: 160.0
      pulp_volume_m3: 40.0

  - case_id: whole_block_uses_operable_area
    mode: whole_block
    option_id: B3__ground_fb_skid__Y1-P1
    requested_area_ha: 3.0
    expected:
      activation: 1
      harvested_area_ha: 4.0
      sawlog_volume_m3: 240.0
      pulp_volume_m3: 80.0

  - case_id: economic_dispatch
    mode: semi_continuous
    period_id: Y1-P1
    required_sawlog_m3: 780.0
    option_ids:
      - B1__ground_fb_skid__Y1-P1
      - B2__ground_fb_skid__Y1-P1
    expected:
      harvested:
        - option_id: B2__ground_fb_skid__Y1-P1
          area_ha: 4.0
          sawlog_volume_m3: 360.0
        - option_id: B1__ground_fb_skid__Y1-P1
          area_ha: 5.25
          sawlog_volume_m3: 420.0
      total_fixed_cost: 180.0
      total_variable_cost: 19140.0
      total_cost: 19320.0

