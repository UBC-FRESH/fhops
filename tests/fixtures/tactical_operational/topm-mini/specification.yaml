specification_version: "0.1.0"
fixture_id: topm-mini
issue: 37
purpose: >
  Copyright-safe executable specification for the FHOPS tactical–operational expansion.
  The values are synthetic and intentionally small so future contract, model, and reporting
  implementations can verify behavior against hand-calculated outcomes.
source_policy: >
  All values are synthetic. This fixture does not copy Oborn thesis appendices, OperMAX data, or
  any restricted commercial dataset.

units:
  area: ha
  volume: m3
  harvest_capacity: m3_per_period
  transport_capacity: m3_per_period
  cost: CAD_2026
  value: CAD_2026_per_m3
  discount_rate: effective_annual_fraction
  distance: km

periods:
  - period_id: Y1-P1
    level: four_week
    sequence: 1
    start_date: "2027-01-01"
    end_date: "2027-01-28"
    duration_days: 28
    available_hours: 672
    discount_factor: 1.0
    season_tags: [winter]
  - period_id: Y1-P2
    level: four_week
    sequence: 2
    start_date: "2027-01-29"
    end_date: "2027-02-25"
    duration_days: 28
    available_hours: 672
    discount_factor: 0.9974
    season_tags: [winter, breakup]

products:
  - product_id: sawlog
    species_group: spruce
    grade: sawlog
  - product_id: pulp
    species_group: spruce
    grade: pulp

planning_units:
  - block_id: B1
