name: Release Build Verification

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Build artifacts are verified first, then published through PyPI trusted
# publishing (OIDC). TestPyPI is used as the upload smoke test before PyPI.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Hatch
        run: |
          python -m pip install --upgrade pip
          pip install hatch

      - name: Build package
        run: hatch clean && hatch build

      - name: Check artifacts for non-FHOPS or sensitive files
        run: |
          listing=$( (for f in dist/*.tar.gz; do tar tzf "$f"; done; for f in dist/*.whl; do unzip -Z1 "$f"; done) )
          if echo "$listing" | grep -E '(^|/)config/|\.sqlite3$|\.djcache$|secret_key|(^|/)\.env$|\.pypirc$|reference-documents/'; then
            echo "::error::Unexpected files in build artifacts (see #118)"
            exit 1
          fi

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fhops-dist
          path: dist

  publish-testpypi:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: fhops-dist
          path: dist
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/

  publish-pypi:
    needs: publish-testpypi
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: fhops-dist
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
