name: Release Build Verification

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Note: this job only builds and uploads artifacts. Publishing to
# TestPyPI/PyPI remains a manual `twine upload` step documented in
# CODING_AGENT.md / notes/release_candidate_prep.md so maintainers
# can verify builds before pushing to production indexes.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Hatch
        run: |
          python -m pip install --upgrade pip
          pip install hatch

      - name: Build package
        run: hatch clean && hatch build

      - name: Check artifacts for non-FHOPS or sensitive files
        run: |
          listing=$( (for f in dist/*.tar.gz; do tar tzf "$f"; done; for f in dist/*.whl; do unzip -Z1 "$f"; done) )
          if echo "$listing" | grep -E '(^|/)config/|\.sqlite3$|\.djcache$|secret_key|(^|/)\.env$|\.pypirc$|reference-documents/'; then
            echo "::error::Unexpected files in build artifacts (see #118)"
            exit 1
          fi

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fhops-dist
          path: dist
