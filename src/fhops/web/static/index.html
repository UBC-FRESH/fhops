<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FHOPS Web</title>
  <link rel="stylesheet" href="static/vendor/maplibre-gl.css">
  <link rel="stylesheet" href="static/style.css">
</head>
<body>
  <div id="app-loading" class="app-loading">Loading FHOPS…</div>
  <header>
    <strong>FHOPS</strong><span class="build">web</span>
    <label>Skin <select id="skin"></select></label>
    <label>Run <select id="run"></select></label>
    <span id="domain" class="badge unknown">—</span>
    <span id="status">loading…</span>
    <button id="refresh" type="button">Refresh</button>
  </header>
  <nav id="workspaces" class="workspaces" role="tablist" aria-label="Workspaces"></nav>
  <main>
    <aside>
      <nav id="tabs" class="tabs" role="tablist" aria-label="Panels"></nav>
      <p id="skin-meta" class="hint"></p>
      <div id="run-meta" class="run-meta"></div>
      <section id="assistant" class="assistant" hidden>
        <h3>Assistant</h3>
        <textarea id="assistant-input" rows="3" placeholder="Ask about this scenario or run…"></textarea>
        <button id="assistant-ask" type="button">Ask</button>
        <pre id="assistant-output" class="assistant-output"></pre>
      </section>
      <p id="empty" class="hint" hidden>No runs found. Pass <code>--runs &lt;dir&gt;</code> to the service.</p>
    </aside>
    <section class="panel">
      <h2 id="panel-title">Runs</h2>
      <div id="panel-loading" class="panel-loading" hidden>Loading…</div>
      <div id="panel-body" role="tabpanel" aria-live="polite"></div>
    </section>
  </main>
  <script src="static/vendor/maplibre-gl.js"></script>
  <script type="module" src="static/app.js?v=13"></script>
</body>
</html>
