<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FHOPS dual 3D replay</title>
  <style>
    html, body { margin: 0; height: 100%; background: #101416; color: #e8eef2; font: 13px/1.3 system-ui, sans-serif; }
    #bar { height: 54px; display: flex; align-items: center; gap: 12px; padding: 0 16px; background: #172024; border-bottom: 1px solid #34444a; }
    #bar strong { font-size: 14px; }
    #bar button { background: #263237; color: #e8eef2; border: 1px solid #52656b; border-radius: 6px; padding: 6px 12px; cursor: pointer; }
    #bar input[type=range] { flex: 1; accent-color: #f08a24; }
    #bar select { background: #263237; color: #e8eef2; border: 1px solid #52656b; border-radius: 6px; padding: 6px; }
    #bar span { color: #9eb0b7; min-width: 100px; text-align: right; font-variant-numeric: tabular-nums; }
    #timeline-toggle { margin-left: 4px; }
    #timeline-panel { position: fixed; left: 0; right: 0; bottom: 0; height: 42vh; z-index: 20; display: none; overflow: auto; padding: 10px 16px 16px; background: #101416f5; border-top: 1px solid #52656b; box-shadow: 0 -8px 28px #0008; }
    #timeline-panel h3 { margin: 0 0 8px; font-size: .9rem; color: #b7c6cc; }
    .timeline-columns { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .timeline-machine { display: grid; grid-template-columns: 42px 1fr; gap: 8px; align-items: center; margin: 3px 0; }
    .timeline-label { color: #9eb0b7; font-size: .72rem; text-align: right; }
    .timeline-track { position: relative; height: 13px; background: #1d292d; border-radius: 3px; overflow: hidden; }
    .timeline-bar { position: absolute; top: 0; height: 100%; min-width: 1px; }
    .timeline-bar:hover { outline: 1px solid #fff; z-index: 2; }
    .timeline-playhead { position: absolute; top: -3px; bottom: -3px; width: 2px; background: #fff; box-shadow: 0 0 0 1px #101416; transform: translateX(-1px); pointer-events: none; z-index: 3; }
    .timeline-track { cursor: ew-resize; touch-action: none; }
    .timeline-legend { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; color: #b7c6cc; font-size: .72rem; }
    .timeline-legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
    @media (max-width: 900px) { .timeline-columns { grid-template-columns: 1fr; } }
    #panes { display: grid; grid-template-columns: 1fr 1fr; height: calc(100% - 55px); gap: 2px; background: #34444a; }
    .pane { position: relative; background: #101416; min-width: 0; }
    .label { position: absolute; left: 12px; top: 12px; z-index: 2; background: #101416d9; border: 1px solid #52656b; border-radius: 7px; padding: 6px 9px; font-weight: 600; }
    iframe { width: 100%; height: 100%; border: 0; }
    @media (max-width: 900px) { #panes { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; } }
  </style>
</head>
<body>
  <div id="bar">
    <strong>FHOPS dual replay</strong>
    <button id="play">Play</button>
    <button id="reset">Reset</button>
    <input id="scrub" type="range" min="0" max="1" step="0.001" value="0" />
    <select id="speed" title="Playback speed; 1× plays the full timeline in 90 seconds">
      <option value="0.25">0.25×</option>
      <option value="0.5">0.5×</option>
      <option value="1" selected>1× (90 s)</option>
      <option value="2">2×</option>
      <option value="4">4×</option>
      <option value="8">8×</option>
    </select>
    <span id="clock">0:00 / 0:00</span>
    <button id="timeline-toggle">Timeline</button>
  </div>
  <div id="timeline-panel">
    <h3>Machine timelines</h3>
    <div class="timeline-columns"><div id="timeline-left"></div><div id="timeline-right"></div></div>
    <div class="timeline-legend"><span><i style="background:#f08a24"></i>felling</span><span><i style="background:#2e86de"></i>skid</span><span><i style="background:#f1c40f"></i>process</span><span><i style="background:#27ae60"></i>load</span><span><i style="background:#8e44ad"></i>truck</span></div>
  </div>
  <div id="panes">
    <div class="pane"><div class="label">Optimal plan</div><iframe id="left"></iframe></div>
    <div class="pane"><div class="label">Your plan</div><iframe id="right"></iframe></div>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const left = document.getElementById('left'), right = document.getElementById('right');
    const prefix = location.pathname.replace(/\/game\/replay\/?$/, '');
    const assetUrl = (value) => value && value.startsWith('/api/') ? prefix + value : value;
    left.src = assetUrl(params.get('left')); right.src = assetUrl(params.get('right'));
    const leftEventsUrl = params.get('leftEvents');
    const rightEventsUrl = params.get('rightEvents');
    const leftDuration = Number(params.get('leftDuration') || 1);
    const rightDuration = Number(params.get('rightDuration') || 1);
    const duration = Math.max(leftDuration, rightDuration, 1);
    const scrub = document.getElementById('scrub'), clock = document.getElementById('clock');
    const speedEl = document.getElementById('speed');
    let playing = false, current = 0, last = performance.now(), speed = 1;
    scrub.max = String(duration);
    const fmt = (v) => `${Math.floor(v / 60)}:${String(Math.floor(v % 60)).padStart(2, '0')}`;
    function apply() {
      for (const frame of [left, right]) {
        const win = frame.contentWindow;
        if (win && win.__setTime) { win.__pause?.(); win.__setTime(current); }
      }
      scrub.value = String(current); clock.textContent = `${fmt(current)} / ${fmt(duration)}`;
      document.querySelectorAll('.timeline-track').forEach((track) => {
        const trackDuration = Number(track.dataset.duration) || duration;
        const playhead = track.querySelector('.timeline-playhead');
        if (playhead) playhead.style.left = `${100 * Math.min(trackDuration, current) / trackDuration}%`;
      });
    }
    function loop(now) {
      requestAnimationFrame(loop);
      const dt = Math.min(0.1, (now - last) / 1000); last = now;
      if (playing) {
        // Full timeline at 1× = 90 real seconds, matching the single viewer.
        current += dt * speed * duration / 90;
        if (current > duration) { current = duration; playing = false; document.getElementById('play').textContent = 'Play'; }
        apply();
      }
    }
    document.getElementById('play').onclick = () => { playing = !playing; document.getElementById('play').textContent = playing ? 'Pause' : 'Play'; last = performance.now(); };
    document.getElementById('reset').onclick = () => { playing = false; document.getElementById('play').textContent = 'Play'; current = 0; apply(); };
    scrub.oninput = () => { current = Number(scrub.value); apply(); };
    speedEl.onchange = () => { speed = Number(speedEl.value); };

    const timelinePanel = document.getElementById('timeline-panel');
    let timelineLoaded = false;
    const timelinePalette = { process: '#f1c40f', load: '#27ae60', unload: '#27ae60', travel_empty: '#2e86de', travel_loaded: '#2e86de', load_dispatch: '#8e44ad', truck: '#8e44ad' };
    function timelineBarColor(type) {
      if (type && (type.includes('travel'))) return '#2e86de';
      if (type && (type.includes('load') || type.includes('unload'))) return '#27ae60';
      if (type && (type.includes('process'))) return '#f1c40f';
      if (type && (type.includes('truck'))) return '#8e44ad';
      return '#f08a24';
    }
    function compactTimelineEvents(events, duration, maxBuckets = 240) {
      const bucketSeconds = Math.max(1, Math.ceil(duration / maxBuckets));
      const groups = new Map();
      for (const event of events) {
        const type = event.type || 'event';
        const start = Number(event.start_s) || 0;
        const end = Math.max(start, Number(event.end_s) || start);
        const firstBucket = Math.floor(start / bucketSeconds);
        const lastBucket = Math.floor(Math.max(start, end - 1e-9) / bucketSeconds);
        for (let bucket = firstBucket; bucket <= lastBucket; bucket += 1) {
          const key = `${type}|${bucket}`;
          const clippedStart = Math.max(start, bucket * bucketSeconds);
          const clippedEnd = Math.min(end, (bucket + 1) * bucketSeconds);
          const existing = groups.get(key);
          if (existing) {
            existing.start_s = Math.min(existing.start_s, clippedStart);
            existing.end_s = Math.max(existing.end_s, clippedEnd);
            existing.count += 1;
          } else {
            groups.set(key, {
              type,
              start_s: clippedStart,
              end_s: clippedEnd,
              count: 1,
            });
          }
        }
      }
      return [...groups.values()].sort((a, b) => a.start_s - b.start_s || a.end_s - b.end_s);
    }
    function renderTimelineSide(root, data) {
      const duration = Number(data.duration_s) || 1;
      const machines = Object.keys(data.machines || {});
      const timeline = data.timeline || [];
      root.innerHTML = '';
      let barCount = 0;
      for (const machine of machines) {
        const events = timeline.filter((event) => event.machine === machine && event.end_s > event.start_s).sort((a, b) => a.start_s - b.start_s);
        const compacted = compactTimelineEvents(events, duration);
        const row = document.createElement('div');
        row.className = 'timeline-machine';
        const label = document.createElement('div');
        label.className = 'timeline-label';
        label.textContent = machine;
        const track = document.createElement('div');
        track.className = 'timeline-track';
        track.dataset.duration = String(duration);
        for (const event of compacted) {
          const bar = document.createElement('span');
          bar.className = 'timeline-bar';
          bar.style.left = `${100 * event.start_s / duration}%`;
          bar.style.width = `${Math.max(0.15, 100 * (event.end_s - event.start_s) / duration)}%`;
          bar.style.background = timelineBarColor(event.type);
          const count = event.count > 1 ? ` · ${event.count} events` : '';
          bar.title = `${machine} · ${event.type} · ${Math.round(event.start_s)}–${Math.round(event.end_s)} s${count}`;
          track.appendChild(bar);
          barCount += 1;
        }
        const playhead = document.createElement('span');
        playhead.className = 'timeline-playhead';
        track.appendChild(playhead);
        row.append(label, track);
        root.appendChild(row);
      }
      return { bars: barCount, events: timeline.length };
    }
    async function loadTimeline() {
      if (timelineLoaded) return;
      timelineLoaded = true;
      document.getElementById('timeline-left').textContent = 'Loading timeline…';
      document.getElementById('timeline-right').textContent = 'Loading timeline…';
      try {
        const [leftData, rightData] = await Promise.all([
          fetch(assetUrl(leftEventsUrl)).then((response) => response.json()),
          fetch(assetUrl(rightEventsUrl)).then((response) => response.json()),
        ]);
        const leftStats = renderTimelineSide(document.getElementById('timeline-left'), leftData);
        const rightStats = renderTimelineSide(document.getElementById('timeline-right'), rightData);
        const heading = document.querySelector('#timeline-panel h3');
        if (heading) {
          heading.textContent = `Machine timelines · ${leftStats.bars + rightStats.bars} bars from ${leftStats.events + rightStats.events} events`;
        }
        apply();
      } catch (error) {
        document.getElementById('timeline-left').textContent = `Timeline unavailable: ${String(error)}`;
        document.getElementById('timeline-right').textContent = '';
        timelineLoaded = false;
      }
    }
    let timelineScrubTrack = null;
    function seekFromTimeline(event) {
      const track = event.target.closest?.('.timeline-track');
      if (!track) return;
      timelineScrubTrack = track;
      scrubTimelineTo(event.clientX);
      playing = false;
      document.getElementById('play').textContent = 'Play';
      track.setPointerCapture?.(event.pointerId);
    }
    function scrubTimelineTo(clientX) {
      if (!timelineScrubTrack) return;
      const trackDuration = Number(timelineScrubTrack.dataset.duration) || duration;
      const rect = timelineScrubTrack.getBoundingClientRect();
      const fraction = Math.min(1, Math.max(0, (clientX - rect.left) / Math.max(1, rect.width)));
      current = fraction * trackDuration;
      apply();
    }
    timelinePanel.addEventListener('pointerdown', seekFromTimeline);
    timelinePanel.addEventListener('pointermove', (event) => {
      if (timelineScrubTrack && event.buttons) scrubTimelineTo(event.clientX);
    });
    timelinePanel.addEventListener('pointerup', () => { timelineScrubTrack = null; });
    timelinePanel.addEventListener('pointercancel', () => { timelineScrubTrack = null; });

    document.getElementById('timeline-toggle').onclick = async () => {
      const showing = timelinePanel.style.display === 'block';
      timelinePanel.style.display = showing ? 'none' : 'block';
      document.getElementById('timeline-toggle').textContent = showing ? 'Timeline' : 'Hide timeline';
      if (!showing) await loadTimeline();
    };
    left.addEventListener('load', () => { setTimeout(apply, 500); });
    right.addEventListener('load', () => { setTimeout(apply, 500); });
    apply(); requestAnimationFrame(loop);
  </script>
</body>
</html>
